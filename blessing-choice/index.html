<!doctype html>
<html lang="zh-CN">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="树枝头的生辰笺，一张一张，都是给你的偏爱。">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f9f5f0">
  <title>树枝头 · 生辰笺</title>
  <link rel="icon" href="data:,">
  <link rel="preload" as="font" href="blessing-choice/blessing-hand.woff2?v=blessing-choice-2" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=shengchen-20">
  <link rel="stylesheet" href="greeting-card.css?v=straight-hair-4">
  <link rel="stylesheet" href="plum-notes.css?v=straight-hair-6">
  <script src="blessing-choice/character.js?v=blessing-choice-2" defer></script>
  <script src="blessing-choice/collection.js?v=blessing-choice-2" defer></script>
  <script src="blessing-choice/choices.js?v=blessing-choice-2" defer></script>
  <script src="greeting-card.js?v=straight-hair-4" defer></script>
<link rel="stylesheet" href="blessing-choice/collection.css?v=blessing-choice-2">
<link rel="stylesheet" href="blessing-choice/choices.css?v=blessing-choice-2"></head>
<body class="letter-notes">
  <main class="scene" data-card-state="closed" data-paper-style="folded" aria-label="树枝头的生辰笺">
    <div class="scene-art" id="scene-art" inert aria-hidden="true">
      <img class="scene-background" src="assets/plum-branch-v18.webp" width="1916" height="821" alt="一枝朱砂红梅从左侧自然伸入，枝杈错落，生辰笺悬于枝间" fetchpriority="high" decoding="async">
      <div id="note-grid" class="note-grid" aria-label="八张藏着惊喜的生辰笺">
      <div class="note-slot note-slot--1" style="--yaw:-14deg;--x:28px;--y:61px;--cord:36px;--tag-width:26px;--angle:-8deg;--sway:1.4deg;--duration:7.6s;--delay:-2.1s">
        <button class="note-trigger" type="button" data-note-id="health" data-character-target="birthday" data-angle="-8"><span class="note-small">给今天的你</span></button>
      </div>
      <div class="note-slot note-slot--2" style="--yaw:10deg;--x:75px;--y:73px;--cord:65px;--tag-width:28px;--angle:5deg;--sway:2deg;--duration:8.7s;--delay:-5.4s">
        <button class="note-trigger" type="button" data-note-id="wealth" data-character-target="star" data-angle="5"><span class="note-small">快乐不限量</span></button>
      </div>
      <div class="note-slot note-slot--3" style="--yaw:-7deg;--x:120px;--y:59px;--cord:41px;--tag-width:26px;--angle:-2deg;--sway:1.6deg;--duration:7.1s;--delay:-1.7s">
        <button class="note-trigger" type="button" data-note-id="beauty" data-character-target="rich" data-angle="-2"><span class="note-small">愿好运偏爱你</span></button>
      </div>
      <div class="note-slot note-slot--4" style="--yaw:15deg;--x:168px;--y:69px;--cord:83px;--tag-width:29px;--angle:7deg;--sway:1.8deg;--duration:9.3s;--delay:-4s">
        <button class="note-trigger" type="button" data-note-id="joy" data-character-target="pause" data-angle="7"><span class="note-small">允许暂停一下</span></button>
      </div>
      <div class="note-slot note-slot--5" style="--yaw:-11deg;--x:217px;--y:64px;--cord:46px;--tag-width:28px;--angle:-5deg;--sway:1.3deg;--duration:8.1s;--delay:-0.8s">
        <button class="note-trigger" type="button" data-note-id="freedom" data-character-target="report" data-angle="-5"><span class="note-small">寿星优先</span></button>
      </div>
      <div class="note-slot note-slot--6" style="--yaw:6deg;--x:265px;--y:63px;--cord:71px;--tag-width:28px;--angle:2deg;--sway:2.1deg;--duration:8.9s;--delay:-6.5s">
        <button class="note-trigger" type="button" data-note-id="luck" data-character-target="secret" data-angle="2"><span class="note-small">暂停营业</span></button>
      </div>
      <div class="note-slot note-slot--7" style="--yaw:-16deg;--x:310px;--y:78px;--cord:39px;--tag-width:28px;--angle:-6deg;--sway:1.5deg;--duration:7.8s;--delay:-3.2s">
        <button class="note-trigger" type="button" data-note-id="sleep" data-character-target="quiet" data-angle="-6"><span class="note-small">不用总说还好</span></button>
      </div>
      <div class="note-slot note-slot--8" style="--yaw:9deg;--x:357px;--y:64px;--cord:28px;--tag-width:26px;--angle:4deg;--sway:1.2deg;--duration:6.8s;--delay:-5.7s">
        <button class="note-trigger" type="button" data-note-id="love" data-character-target="surprise" data-angle="4"><span class="note-small">也别忘了自己</span></button>
      </div>
      </div>
      <div class="character" id="birthday-character" role="img" aria-label="女生直立从右侧探出半个身子，双手扒住右边缘，抬头好奇地望着枝头的生辰笺">
        <div class="actor"><div class="actor-frames">
          <img class="actor-pose is-current" data-pose="peek" src="assets/straight-hair/peek.webp" width="983" height="1600" alt="" decoding="async" fetchpriority="high">
        </div></div>
      </div>
      <div class="petals" aria-hidden="true">
        <span style="--px:42px;--py:101px;--drift:26px;--fall:440px;--time:17s;--wait:-3s;--turn:32deg"><img src="assets/petal.webp" alt=""></span>
        <span style="--px:316px;--py:113px;--drift:-28px;--fall:350px;--time:20s;--wait:-12s;--turn:-52deg"><img src="assets/petal.webp" alt=""></span>
        <span style="--px:93px;--py:173px;--drift:35px;--fall:420px;--time:23s;--wait:-18s;--turn:75deg"><img src="assets/petal.webp" alt=""></span>
        <span style="--px:278px;--py:203px;--drift:24px;--fall:340px;--time:21s;--wait:-7s;--turn:110deg"><img src="assets/petal.webp" alt=""></span>
      </div>
      <div class="scene-footer">
        <h1 class="ending-wish" id="birthday-title" tabindex="-1" hidden><span>生辰喜乐，岁岁安宁</span><span>愿前路明朗，诸事顺遂</span></h1>
        <div class="selection-panel" id="selection-panel">
          <p class="scene-hint" id="scene-hint"><span>送给新一岁的你。</span><span>只能挑三份祝福哦。</span></p>
          <p class="selection-summary" id="selection-summary" aria-live="polite">点开枝头纸笺，挑选你的祝福</p>
          <p class="selection-summary selection-summary--measure" aria-hidden="true">已选 8 份 · 健康 · 暴富 · 漂亮 · 快乐 · 自由 · 好运 · 好眠 · 被爱</p>
          <button class="selection-submit" id="selection-submit" type="button" disabled>就选这些</button>
        </div>
      </div>
    </div>
    <div class="greeting-card" id="greeting-card">
      <div class="greeting-flap greeting-flap--left" aria-hidden="true"></div>
      <div class="greeting-flap greeting-flap--right" aria-hidden="true"></div>
      <button class="greeting-open" id="greeting-open" type="button" aria-label="打开贺卡" aria-controls="scene-art" aria-expanded="false"></button>
    </div>
    <span id="note-count" class="visually-hidden" role="status" aria-live="polite"></span>
    <noscript><style>.greeting-card{display:none}</style></noscript>
    <noscript><p class="no-script-wish">请启用 JavaScript 后，点开枝头纸笺。</p></noscript>
  </main>
  <template id="paper-note-template">
    <div class="paper-note">
      <div class="note-face note-front">
        <img class="note-paper" src="assets/paper-folded-v5.webp" width="793" height="1983" alt="" draggable="false" decoding="async">
        <div class="note-writing note-writing--front"><div class="note-content"><span class="note-label"></span><span class="note-small"></span></div></div>
      </div>
      <div class="note-face note-back" aria-hidden="true">
        <img class="note-paper" src="assets/paper-folded-v5.webp" width="793" height="1983" alt="" draggable="false" decoding="async">
        <div class="note-writing note-writing--back"><div class="back-content">
          <p class="back-eyebrow" aria-hidden="true"></p>
          <p class="note-back-text"></p>
          <p class="back-signature" aria-hidden="true"></p>
        </div></div>
      </div>
    </div>
  </template>
  <dialog id="note-dialog" aria-describedby="note-front-text">
    <div id="note-dimmer" class="note-dimmer" aria-hidden="true"></div>
    <div class="note-stage">
      <div id="note-flight" tabindex="0" role="group" aria-label="生辰笺">
        <div id="note-flipper" class="paper-note paper-note--expanded"></div>
        <div id="note-physical" aria-hidden="true" hidden></div>
      </div>
      <div class="note-actions"><button id="note-close" type="button">收下祝福</button></div>
    </div>
  </dialog>
</body>
</html>
