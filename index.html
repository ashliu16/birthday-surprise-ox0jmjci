<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一份为你准备的生日祝福。">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf5eb">
  <title>给你的生日惊喜</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; background: #fbf5eb; color: #30221f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(100%, 600px); min-height: 100vh; min-height: 100svh; margin: auto; padding: 40px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .eyebrow { margin: 0 0 28px; color: #98634b; font-size: 12px; font-weight: 600; letter-spacing: .2em; }
    h1 { margin: 0; font-size: clamp(42px, 12vw, 64px); letter-spacing: -.06em; line-height: 1.25; }
    .intro { margin: 24px 0 36px; color: #7e6b60; line-height: 1.9; font-size: 16px; }
    button { min-height: 54px; width: min(100%, 280px); padding: 15px 25px; border: 0; border-radius: 999px; background: #a94730; color: #fff9ef; font: inherit; font-weight: 600; cursor: pointer; touch-action: manipulation; }
    button:hover { background: #943d2a; }
    button:focus-visible { outline: 3px solid #30221f; outline-offset: 5px; }
    .wish { max-width: 360px; margin: 32px 0 0; font-size: 18px; line-height: 1.9; }
    [hidden] { display: none !important; }
    footer { margin-top: 64px; color: #a49184; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A LITTLE SURPRISE FOR YOU</p>
    <h1>生日快乐！</h1>
    <p class="intro">今天的主角，是你。<br>一份小小的祝福，等你打开。</p>
    <button id="open-wish" type="button" aria-controls="wish" aria-expanded="false">打开生日祝福</button>
    <p class="wish" id="wish" hidden aria-live="polite">愿你新的一岁，<br>有热爱的事，有相伴的人，<br>也有属于自己的快乐。</p>
    <footer>愿今天的一切，都温柔地围绕着你。</footer>
  </main>
  <script>
    document.getElementById('open-wish').addEventListener('click', function () {
      const wish = document.getElementById('wish');
      const open = wish.hidden;
      wish.hidden = !open;
      this.setAttribute('aria-expanded', String(open));
      this.textContent = open ? '收好这份祝福' : '打开生日祝福';
    });
  </script>
</body>
</html>
