<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="点开一张纸条，查收为你准备的生日惊喜。">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fff8e9">
  <title>给你的生日惊喜</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="scene" aria-label="为你准备的生日惊喜">
    <div id="note-grid" class="note-grid" aria-label="八张藏着惊喜的祝福纸条">
      <div class="note-slot note-slot--1">
        <button class="note-trigger" type="button" data-note-id="birthday" data-angle="-34"><span class="note-label">生日快乐</span></button>
      </div>
      <div class="note-slot note-slot--2">
        <button class="note-trigger" type="button" data-note-id="star" data-angle="-11"><span class="note-label">今天你最大</span></button>
      </div>
      <div class="note-slot note-slot--3">
        <button class="note-trigger" type="button" data-note-id="rich" data-angle="5"><span class="note-label">祝你暴富</span></button>
      </div>
      <div class="note-slot note-slot--4">
        <button class="note-trigger" type="button" data-note-id="pause" data-angle="22"><span class="note-label">烦恼暂停</span></button>
      </div>
      <div class="note-slot note-slot--5">
        <button class="note-trigger" type="button" data-note-id="report" data-angle="-38"><span class="note-label">年度报告</span></button>
      </div>
      <div class="note-slot note-slot--6">
        <button class="note-trigger" type="button" data-note-id="secret" data-angle="64"><span class="note-label">先别感动</span></button>
      </div>
      <div class="note-slot note-slot--7">
        <button class="note-trigger" type="button" data-note-id="quiet" data-angle="69"><span class="note-label">今日免打扰</span></button>
      </div>
      <div class="note-slot note-slot--8">
        <button class="note-trigger" type="button" data-note-id="surprise" data-angle="76"><span class="note-label">背面有惊喜</span></button>
      </div>
    </div>
    <section class="birthday-center" aria-labelledby="birthday-title">
      <img class="birthday-cake" src="assets/cake.png" width="1254" height="1254" alt="插着一支亮蜡烛的卡通草莓生日蛋糕" fetchpriority="high" decoding="async">
      <h1 id="birthday-title">生日快乐，<br>今天你最大。</h1>
      <p class="birthday-copy">有些祝福，翻过来才懂。</p>
    </section>
    <footer class="scene-footer">点一张纸条，背面有话偷偷告诉你</footer>
    <span id="note-count" class="visually-hidden" role="status" aria-live="polite"></span>
    <noscript><p class="no-script-wish">愿你新的一岁，有热爱的事，有相伴的人，也有属于自己的快乐。</p></noscript>
  </main>
  <dialog id="note-dialog" aria-describedby="note-back-text">
    <button id="note-dimmer" class="note-dimmer" type="button" tabindex="-1" aria-label="关闭当前纸条"></button>
    <div class="note-stage">
      <div id="note-flight">
        <div id="note-flipper">
          <div class="note-face note-front"><h2 id="note-front-text"></h2></div>
          <div class="note-face note-back">
            <div class="back-content">
              <p class="back-eyebrow">偷偷告诉你</p>
              <p id="note-back-text"></p>
              <p class="back-signature">一份小小的偏爱</p>
            </div>
          </div>
        </div>
      </div>
      <div class="note-actions">
        <button id="note-again" type="button">再翻一次</button>
        <button id="note-close" type="button">放回去</button>
      </div>
    </div>
  </dialog>
</body>
</html>
