<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="点开一张纸条，查收为你准备的生日惊喜。">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fff8e9">
  <title>给你的生日惊喜</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=birthday-notes-4">
  <script src="script.js?v=birthday-notes-4" defer></script>
</head>
<body>
  <main class="scene" aria-label="为你准备的生日惊喜">
    <div id="note-grid" class="note-grid" aria-label="八张藏着惊喜的祝福纸条">
      <div class="note-slot note-slot--1">
        <button class="note-trigger" type="button" data-note-id="birthday" data-angle="-17"><span class="note-content"><span class="note-label">生日快乐呀</span><span class="note-small">给今天的你</span></span></button>
      </div>
      <div class="note-slot note-slot--2">
        <button class="note-trigger" type="button" data-note-id="star" data-angle="-2"><span class="note-content"><span class="note-label">开心多一点</span><span class="note-small">快乐不限量</span></span></button>
      </div>
      <div class="note-slot note-slot--3">
        <button class="note-trigger" type="button" data-note-id="rich" data-angle="14"><span class="note-content"><span class="note-label">愿望都成真</span><span class="note-small">小小心愿</span></span></button>
      </div>
      <div class="note-slot note-slot--4">
        <button class="note-trigger" type="button" data-note-id="pause" data-angle="23"><span class="note-content"><span class="note-label">今天你最大</span><span class="note-small">寿星优先</span></span></button>
      </div>
      <div class="note-slot note-slot--5">
        <button class="note-trigger" type="button" data-note-id="report" data-angle="-73"><span class="note-content"><span class="note-label">蛋糕管够</span><span class="note-small">奶油也管够</span></span></button>
      </div>
      <div class="note-slot note-slot--6">
        <button class="note-trigger" type="button" data-note-id="secret" data-angle="74"><span class="note-content"><span class="note-label">烦恼先休假</span><span class="note-small">暂停营业</span></span></button>
      </div>
      <div class="note-slot note-slot--7">
        <button class="note-trigger" type="button" data-note-id="quiet" data-angle="-58"><span class="note-content"><span class="note-label">新的一岁吃好玩好</span><span class="note-small">很认真的祝福</span></span></button>
      </div>
      <div class="note-slot note-slot--8">
        <button class="note-trigger" type="button" data-note-id="surprise" data-angle="58"><span class="note-content"><span class="note-label">愿你一直被爱包围</span><span class="note-small">一直都值得</span></span></button>
      </div>
    </div>
    <section class="birthday-center" aria-labelledby="birthday-title">
      <img class="birthday-cake" src="assets/cake.png" width="1254" height="1254" alt="插着一支亮蜡烛的卡通草莓生日蛋糕" fetchpriority="high" decoding="async">
      <h1 id="birthday-title">生日快乐，<br>今天你最大。</h1>
      <p class="birthday-copy">有些祝福，翻过来才懂。</p>
    </section>
    <footer class="scene-footer">点开纸条 · 拖动翻面 · 查收小小惊喜</footer>
    <span id="note-count" class="visually-hidden" role="status" aria-live="polite"></span>
    <noscript><p class="no-script-wish">愿你新的一岁，有热爱的事，有相伴的人，也有属于自己的快乐。</p></noscript>
  </main>
  <template id="paper-note-template">
    <div class="paper-note">
      <div class="note-face note-front">
        <img class="note-paper" src="assets/birthday-note-v2.png" width="887" height="1774" alt="" draggable="false" decoding="async">
        <div class="note-writing note-writing--front">
          <div class="note-content"><span class="note-label"></span><span class="note-small"></span></div>
        </div>
      </div>
      <div class="note-face note-back" aria-hidden="true">
        <img class="note-paper" src="assets/birthday-note-v2.png" width="887" height="1774" alt="" draggable="false" decoding="async">
        <div class="note-writing note-writing--back">
          <div class="back-content">
            <p class="back-eyebrow">偷偷告诉你</p>
            <p class="note-back-text"></p>
            <p class="back-signature">一份小小的偏爱</p>
          </div>
        </div>
      </div>
    </div>
  </template>
  <dialog id="note-dialog" aria-describedby="note-front-text note-gesture-hint">
    <button id="note-dimmer" class="note-dimmer" type="button" tabindex="-1" aria-label="关闭当前纸条"></button>
    <div class="note-stage">
      <div id="note-flight" tabindex="0" role="group" aria-label="祝福纸条，左右拖动或按左右方向键翻面" aria-describedby="note-gesture-hint">
        <div id="note-flipper" class="paper-note paper-note--expanded"></div>
      </div>
      <p id="note-gesture-hint" class="note-gesture-hint" role="status">左右拖动纸条，翻到背面</p>
      <div class="note-actions">
        <button id="note-close" type="button">放回去</button>
      </div>
    </div>
  </dialog>
</body>
</html>
